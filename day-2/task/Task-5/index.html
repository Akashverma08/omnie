<html>

<head>
    <title>
        Promise any
    </title>

<body>
    <h1>Burger,Meal,Fries</h1>
    <hr>
    <p id="demo"></p>
    <h4 id="done"></h4>
    <button onclick="order()">Order</button>

    <script>
        

        function order() {
            let burger = new Promise((res, rej) => {
                setTimeout(() => {
                    res("Burger is ready");
                }, 3000);
            })

            let coke = new Promise((res, rej) => {
                setTimeout(() => {
                    res("Coke is ready");
                }, 2000);

            })

            let fries = new Promise((res, rej) => {
                setTimeout(() => {
                    res("Fries is ready");
                }, 1000);
            })
            Promise.any([burger, coke, fries])
                .then((result) => {
                    document.getElementById("demo").innerText = result;
                })
                .finally(() => {
                    document.getElementById("done").innerText = "Order Done"
                })
        }
    </script>
</body>
</head>

</html>
